name: Keep Streamlit app awake

on:
  schedule:
    # Every 4 hours (well inside Streamlit's ~6-hour sleep window)
    - cron: "17 */4 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (headless browser)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app (and wake it if it's asleep)
        env:
          APP_URL: https://syplus-cx-tracker-jke3xrat78aldg2z5rfqdn.streamlit.app/
        run: |
          python - <<'EOF'
          import os, re
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(8000)

              wake = page.get_by_role("button", name=re.compile("get this app back up", re.I))
              if wake.count() > 0:
                  print("App was asleep - clicking the wake-up button...")
                  wake.first.click()
                  page.wait_for_timeout(60000)  # give it time to boot
                  print("Wake-up requested.")
              else:
                  print("App is already awake - visit registered.")
                  page.wait_for_timeout(15000)  # stay long enough to count as a session

              browser.close()
          EOF
